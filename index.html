<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Настройка интернета</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #ffffff;
            font-family: sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }
        #ui { text-align: center; }
        .wifi-icon { font-size: 60px; color: #007aff; margin-bottom: 15px; }
        h1 { font-size: 22px; margin-bottom: 10px; }
        button {
            background: #007aff; color: white; border: none;
            padding: 15px 45px; font-size: 20px; border-radius: 12px;
            font-weight: bold; cursor: pointer;
        }
        #screamer-container {
            display: none; position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: black; z-index: 9999;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="wifi-icon">📶</div>
        <h1>Обнаружена сеть Wi-Fi</h1>
        <p>Нажмите для автоматической настройки</p>
        <button onclick="launchScreamer()">ПОДКЛЮЧИТЬ</button>
    </div>

    <div id="screamer-container">
        <video id="scaryVideo" playsinline>
            <source src="1909901693.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        async function launchScreamer() {
            const container = document.getElementById('screamer-container');
            const video = document.getElementById('scaryVideo');

            // --- 1. УСИЛЕНИЕ ЗВУКА ---
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaElementSource(video);
                const gainNode = audioCtx.createGain();
                
                gainNode.gain.value = 4.5; // Увеличиваем громкость файла в 4.5 раза
                
                source.connect(gainNode);
                gainNode.connect(audioCtx.destination);
            } catch (e) { console.log("AudioContext blocked"); }

            // --- 2. ПОЛНЫЙ ЭКРАН ---
            const doc = document.documentElement;
            if (doc.requestFullscreen) await doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) await doc.webkitRequestFullscreen();

            // --- 3. ПОВОРОТ ЭКРАНА ---
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }

            // --- 4. ЗАПУСК СКРИМЕРА ---
            document.getElementById('ui').style.display = 'none';
            container.style.display = 'block';
            
            video.play();

            // --- 5. ЖЕСТКАЯ ВИБРАЦИЯ ---
            if (navigator.vibrate) {
                // Вибрируем длинными рывками в такт крику
                navigator.vibrate([500, 100, 500, 100, 500, 100, 1000]);
            }
        }
    </script>
</body>
</html>
