<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Бесплатный Wi-Fi</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #f0f0f0;
            font-family: sans-serif;
        }

        #ui {
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; height: 100%;
        }

        .wifi-button {
            padding: 20px 40px; font-size: 24px;
            background-color: #007bff; color: white;
            border: none; border-radius: 10px; cursor: pointer;
        }

        #screamer-container {
            display: none; position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: black; z-index: 9999;
        }

        video {
            width: 100%; height: 100%; object-fit: cover;
        }

        /* Если телефон стоит вертикально, мы принудительно разворачиваем видео на бок */
        @media screen and (orientation: portrait) {
            .force-landscape {
                transform: rotate(90deg);
                transform-origin: center;
                width: 100vh !important;
                height: 100vw !important;
                position: absolute;
                top: 50%; left: 50%;
                margin-left: -50vh;
                margin-top: -50vw;
                object-fit: cover;
            }
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Бесплатный Wi-Fi рядом</h1>
        <p>Нажмите для проверки сигнала</p>
        <button class="wifi-button" onclick="startScreamer()">ПОДКЛЮЧИТЬСЯ</button>
    </div>

    <div id="screamer-container">
        <video id="screamer-video" src="1909901693.mp4" preload="auto" playsinline loop></video>
    </div>

    <script>
        async function startScreamer() {
            const container = document.getElementById('screamer-container');
            const video = document.getElementById('screamer-video');
            const ui = document.getElementById('ui');

            // 1. Показываем видео блок
            ui.style.display = 'none';
            container.style.display = 'block';

            // 2. Включаем звук и видео
            video.muted = false;
            video.volume = 1.0;
            
            // Пытаемся запустить видео
            let playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    // Если браузер блокирует звук, запускаем без звука и сразу включаем его
                    video.muted = true;
                    video.play();
                    video.muted = false;
                });
            }

            // 3. Пытаемся войти в полноэкранный режим
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();

            // 4. Пытаемся ПЕРЕВЕРНУТЬ экран программно (для Android)
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {
                    // Если не вышло — добавляем CSS класс для разворота картинки
                    video.classList.add('force-landscape');
                });
            } else {
                // Если Safari или старый браузер — просто разворачиваем видео стилями
                video.classList.add('force-landscape');
            }
        }
    </script>
</body>
</html>
