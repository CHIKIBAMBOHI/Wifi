<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бесплатный Wi-Fi</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #ui {
            text-align: center;
        }

        .wifi-button {
            padding: 20px 40px;
            font-size: 24px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Контейнер для скримера */
        #screamer-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Эффект переворота для мобильных (горизонтальная ориентация) */
        @media screen and (orientation: portrait) {
            video {
                transform: rotate(90deg);
                width: 100vh;
                height: 100vw;
                object-fit: cover;
                position: absolute;
                top: 50%;
                left: 50%;
                translate: -50% -50%;
            }
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Доступен бесплатный Wi-Fi</h1>
        <p>Нажмите кнопку для подключения</p>
        <button class="wifi-button" onclick="startScreamer()">ПОДКЛЮЧИТЬСЯ</button>
    </div>

    <div id="screamer-container">
        <video id="screamer-video" src="screamer.mp4" preload="auto"></video>
    </div>

    <script>
        function startScreamer() {
            const container = document.getElementById('screamer-container');
            const video = document.getElementById('screamer-video');
            const ui = document.getElementById('ui');

            // 1. Убираем интерфейс и показываем видео
            ui.style.display = 'none';
            container.style.display = 'block';

            // 2. Включаем полноэкранный режим
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.mozRequestFullScreen) { // Firefox
                elem.mozRequestFullScreen();
            } else if (elem.webkitRequestFullscreen) { // Chrome, Safari and Opera
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { // IE/Edge
                elem.msRequestFullscreen();
            }

            // 3. Запускаем видео на полную громкость
            video.volume = 1.0;
            video.play();

            // 4. Дополнительная защита: если видео закончится, можно зациклить
            video.loop = true;
        }
    </script>
</body>
</html>
