<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Бесплатный Wi-Fi</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #ui {
            text-align: center;
            padding: 20px;
        }

        .wifi-button {
            padding: 20px 40px;
            font-size: 24px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            -webkit-tap-highlight-color: transparent; /* Убирает блик на мобильных */
        }

        /* Контейнер для скримера */
        #screamer-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Растягивает видео на весь экран */
        }

        /* ЗАПАСНОЙ ВАРИАНТ (CSS-поворот) */
        /* Если JavaScript-поворот не сработает (например, в Safari на iPhone),
           мы используем CSS, чтобы хотя бы повернуть картинку. */
        @media screen and (orientation: portrait) {
            #screamer-video.fallback-rotate {
                transform: rotate(90deg);
                width: 100vh;
                height: 100vw;
                position: absolute;
                top: 50%;
                left: 50%;
                translate: -50% -50%;
                object-fit: cover;
            }
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>Доступен бесплатный Wi-Fi</h1>
        <p>Нажмите кнопку для подключения</p>
        <button class="wifi-button" onclick="startScreamer()">ПОДКЛЮЧИТЬСЯ</button>
    </div>

    <div id="screamer-container">
        <video id="screamer-video" src="1909901693.mp4" preload="auto"></video>
    </div>

    <script>
        async function startScreamer() {
            const container = document.getElementById('screamer-container');
            const video = document.getElementById('screamer-video');
            const ui = document.getElementById('ui');

            // 1. Показываем видео
            ui.style.display = 'none';
            container.style.display = 'block';

            // 2. Включаем полноэкранный режим (ОБЯЗАТЕЛЬНО для поворота)
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                await elem.requestFullscreen();
            } else if (elem.mozRequestFullScreen) { // Firefox
                await elem.mozRequestFullScreen();
            } else if (elem.webkitRequestFullscreen) { // Chrome, Safari
                await elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { // IE/Edge
                await elem.msRequestFullscreen();
            }

            // 3. ПОПЫТКА ПЕРЕВЕРНУТЬ ТЕЛЕФОН ГОРИЗОНТАЛЬНО (Screen Orientation API)
            if (screen.orientation && screen.orientation.lock) {
                try {
                    // Запрещаем вертикальный режим, разрешаем только горизонтальный
                    await screen.orientation.lock('landscape');
                    console.log("Ориентация экрана заблокирована: landscape");
                } catch (error) {
                    console.error("Не удалось заблокировать ориентацию:", error);
                    // Если не сработало (например, iOS), включаем CSS-заплатку
                    video.classList.add('fallback-rotate');
                }
            } else {
                // Если API не поддерживается браузером, сразу включаем CSS-заплатку
                console.log("Screen Orientation API не поддерживается");
                video.classList.add('fallback-rotate');
            }

            // 4. Запускаем видео на полную громкость
            video.volume = 1.0;
            video.play();
            video.loop = true; // Зациклить видео
        }
    </script>
</body>
</html>
